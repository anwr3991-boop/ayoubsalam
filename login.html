<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>دخول الموظفين - جامعة السلام الدولية</title>
  <!-- قفل قطعي لمنع الارتجاج الجانبي للهواتف -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* نظام الألوان الملكي الموحد: أسود ملكي غامق وتوهج الذهب النقي */
    :root {
      --bg-dark: #07090e;
      --card-bg: linear-gradient(145deg, rgba(15, 22, 38, 0.95), rgba(7, 9, 14, 0.98));
      --primary: #fbbf24;       /* ذهبي رئيسي */
      --primary-dark: #b45309;  /* ذهبي غامق */
      --good: #10b981;
      --bad: #ef4444;
      --gold-light: #fcd34d;
      --gold-glow: rgba(251, 191, 36, 0.25);
      --text: #ffffff;
      --muted: #94a3b8;
      --border-gold: rgba(251, 191, 36, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Cairo", sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    /* الخلفية الشعاعية الملكية المطابقة للوحة التحكم */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, #111625 0%, #07090e 70%, #000000 100%) !important;
      pointer-events: none;
      z-index: 1;
    }

    .bg {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }

    /* كرت زجاجي ملكي محاط بإطار ذهبي مضيء */
    .card {
      background: var(--card-bg) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid var(--border-gold) !important;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 0 0 30px var(--gold-glow) !important;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* الهيدر والشعار */
    .top {
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logoWrap {
      position: relative;
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 50%; /* شكل دائري فخم */
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brandText {
      margin-top: 4px;
    }

    .uni {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .sub {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* حبة بيل البوابة بالذهب الملكي */
    .statusPill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.25);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      color: var(--gold-light);
      font-weight: 700;
      margin-top: 16px;
      box-shadow: 0 0 10px var(--gold-glow);
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary);
    }

    /* الفورم وحقول الإدخال */
    .wrap {
      text-align: right;
    }

    .box {
      margin-bottom: 20px;
    }

    .box label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
      padding-right: 2px;
    }

    /* حقول المدخلات المحسنة بالكامل */
    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(251, 191, 36, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
      text-align: right;
    }

    .form-control:focus {
      border-color: var(--primary) !important;
      background: #030712;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    /* زر الإرسال الذهبي الفخم والمطابق لهوية النظام */
    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      border: 1px solid #fef08a !important;
      border-radius: 12px;
      color: #000000 !important; /* نص أسود فخم فوق الذهب */
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: 0 6px 20px var(--gold-glow) !important;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.5) !important;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)) !important;
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* رسائل التنبيه */
    .msg {
      min-height: 24px;
      margin-top: 20px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .msg.info { color: var(--gold-light); text-shadow: 0 0 8px var(--gold-glow); }
    .msg.error { color: var(--bad); }
    .msg.ok { color: var(--good); }

    /* أنيميشن الاهتزاز الأصلي */
    @keyframes headShake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
      100% { transform: translateX(0); }
    }

    .card.shake {
      animation: headShake 0.4s ease-in-out;
    }

    /* استجابة الهواتف الفخمة */
    @media (max-width: 480px) {
      .card {
        padding: 35px 22px;
        border-radius: 20px;
      }
      .uni { font-size: 1.35rem; }
    }
  </style>
</head>

<body>

  <div class="bg">
    <div class="card" id="mainCard">
      
      <header class="top">
        <div class="brand">
          <div class="logoWrap">
            <img src="aiu-logo.png" alt="شعار جامعة السلام الدولية" class="logo" />
          </div>
          <div class="brandText">
            <div class="uni">جامعة السلام الدولية</div>
            <div class="sub">منظومة شؤون الطلبة والامتحانات</div>
          </div>
        </div>
        <div class="statusPill">
          <span class="dot"></span>
          <span>بوابة الموظفين الآمنة</span>
        </div>
      </header>

      <div class="wrap">
        <form id="loginForm" onsubmit="handleLogin(event)">
          
          <div class="box">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم" required autocomplete="username" />
          </div>

          <div class="box">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">تسجيل الدخول للنظام</button>
        </form>
      </div>

      <div id="msgBox" class="msg"></div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgmunZv-wU-kBJqP6cbVk-A1sqoWd9TYqesW7FS0CWz5XRejQ23hOJ0QqpTwpjI0X8kQ/exec";

    function soundSuccess() {
      const audio = new Audio("https://www.soundjay.com/buttons/sounds/button-09.mp3");
      audio.play().catch(()=>{});
    }

    function soundError() {
      const audio = new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");
      audio.play().catch(()=>{});
    }

    function setMsg(text, type) {
      const msgBox = document.getElementById("msgBox");
      msgBox.className = "msg " + type;
      msgBox.textContent = text;
    }

    function setLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      if (isLoading) {
        btn.disabled = true;
        btn.style.opacity = "0.7";
      } else {
        btn.disabled = false;
        btn.style.opacity = "1";
      }
    }

    function punchCard(className) {
      const card = document.getElementById("mainCard");
      card.classList.remove("shake", "success");
      void card.offsetWidth; // Trigger reflow
      card.classList.add(className);
    }

    async function handleLogin(e) {
      e.preventDefault();

      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();

      if (!u || !p) {
        setMsg("❌ الرجاء ملء الحقول المطلوبة.", "error");
        punchCard("shake");
        soundError();
        return;
      }

      setLoading(true);
      setMsg("⏳ جاري التحقق من بيانات الدخول...", "info");

      const url = `${API_URL}?action=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`;

      try {
        const res  = await fetch(url);
        const text = await res.text();

        let data;
        try { 
          data = JSON.parse(text); 
        } catch (e) {
          setLoading(false);
          setMsg("خطأ في قراءة رد السيرفر (الرد ليس JSON).", "error");
          punchCard("shake");
          soundError();
          return;
        }

        if (data.status === "OK") {
          const username = data.username || u;
          const role     = data.role || "";

          // 💾 تخزين الاسم بجميع المفاتيح المتوقعة لضمان التوافق التام مع بقية الصفحات
          localStorage.setItem("USERNAME", username);
          localStorage.setItem("username", username);
          localStorage.setItem("user", username);
          localStorage.setItem("ROLE", role);
          localStorage.setItem("aiu_user", username);
          localStorage.setItem("aiu_role", role);

          sessionStorage.setItem("username", username);

          setMsg("✔ تم تسجيل الدخول بنجاح، جاري التحويل...", "ok");
          punchCard("success");
          soundSuccess();

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 850);

        } else {
          setLoading(false);
          setMsg(data.message || "❌ بيانات الدخول غير صحيحة.", "error");
          punchCard("shake");
          soundError();
        }

      } catch (error) {
        setLoading(false);
        setMsg("❌ خطأ في الاتصال بالسيرفر، تحقق من الشبكة.", "error");
        punchCard("shake");
        soundError();
      }
    }
  </script>
</body>
</html>
