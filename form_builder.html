<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>منظومة إنشاء استمارات التسجيل المبدئي - جامعة السلام</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       تصميم الشاشة (أدوات التحكم)
       ========================================= */
    :root {
      --primary: #0f2042;
      --gold: #d4af37;
      --bg: #050811;
      --card-bg: rgba(11, 21, 40, 0.95);
      --border-soft: rgba(212, 175, 55, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: var(--bg);
      color: #e5e7eb;
      direction: rtl;
    }

    .no-print {
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .top-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .panel-header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }

    .panel-header h1 { margin: 0; color: var(--gold); font-size: 1.5rem; font-weight: 900; }
    .panel-header p { margin: 5px 0 0; color: #94a3b8; font-size: 0.9rem; }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.85rem; color: #cbd5e1; font-weight: bold; }
    .field select {
      padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: #070f21; color: #fff; font-family: inherit; font-size: 0.95rem;
    }
    .field select:focus {
      border-color: var(--gold); outline: none;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 12px;
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.05);
      max-height: 450px;
      overflow-y: auto;
    }

    .course-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .course-item:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); }
    .course-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .course-item span { font-size: 0.9rem; font-weight: 600; flex: 1; }
    .course-item .c-code { color: var(--gold); font-weight: 900; margin-left: 5px; flex: 0 0 auto; }
    
    .unit-input {
      width: 60px;
      padding: 5px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.3);
      background: #fff;
      color: #000;
      text-align: center;
      font-weight: bold;
    }

    .btn {
      padding: 12px 30px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-print { background: var(--gold); color: #000; }
    .btn-print:hover { filter: brightness(1.1); }

    .btn-clear { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    .btn-clear:hover { background: #ef4444; color: #fff; }

    /* =========================================
       تصميم ورقة الطباعة - (التحكم الكامل لكل سطر: عرض، طول، مكان)
       ========================================= */
    .print-page { display: none; }

    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff; color: #000; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      
      .print-page { 
        display: block !important; 
        width: 230mm; 
        height: 297mm; 
        background: transparent; 
        position: relative;
      }

      .p-header, .p-title, .p-student-info, .p-footer, thead, .p-table td:nth-child(6) {
        display: none !important; 
      }

      .p-table {
        position: absolute;
        top: 0mm; 
        right: 0mm; 
        width: 100%;
        border: none !important;
        direction: rtl !important; 
      }

      .p-table tbody {
        position: relative;
        display: block; 
      }

      /* كل سطر أصبح بوكس مستقل تماماً يتحكم في مكانه (top, right) */
      .p-table tbody tr {
        position: absolute; 
        display: flex; 
        flex-direction: row;
      }

      /* تصميم الخانات الداخلية لكل بوكس */
      .p-table td {
        box-sizing: border-box;
        border: 1px solid transparent !important; /* الخطوط ولت شفافة، ولا رقم تحرك */
        color: #000 !important; 
        font-size: 13px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: -1px; 
      }

      /* ==========================================================================
         تحكم كامل لكل سطر على حدة (الارتفاع height، المكان top، واليمين right)
         ========================================================================== */
      
      /* السطر الأول */
      .p-table tbody tr:nth-child(1) { top: 230mm; right: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(1) td:nth-child(1) { width: 6mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(1) td:nth-child(2) { width: 19mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(1) td:nth-child(3) { width: 51mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(1) td:nth-child(4) { width: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(1) td:nth-child(5) { width: 21mm; height: 6.6mm; }

      /* السطر الثاني */
      .p-table tbody tr:nth-child(2) { top: 236mm; right: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(2) td:nth-child(1) { width: 6mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(2) td:nth-child(2) { width: 19mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(2) td:nth-child(3) { width: 51mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(2) td:nth-child(4) { width: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(2) td:nth-child(5) { width: 21mm; height: 6.6mm; }

      /* السطر الثالث */
      .p-table tbody tr:nth-child(3) { top: 242mm; right: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(3) td:nth-child(1) { width: 6mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(3) td:nth-child(2) { width: 19mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(3) td:nth-child(3) { width: 51mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(3) td:nth-child(4) { width: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(3) td:nth-child(5) { width: 21mm; height: 6.6mm; }

      /* السطر الرابع (اللي كان متعبك - تقدر تعدل طوله وعرضه ومكانه بروحه بالكامل) */
      .p-table tbody tr:nth-child(4) { top: 248mm; right: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(4) td:nth-child(1) { width: 6mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(4) td:nth-child(2) { width: 19mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(4) td:nth-child(3) { width: 51mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(4) td:nth-child(4) { width: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(4) td:nth-child(5) { width: 21mm; height: 6.6mm; }

      /* السطر الخامس */
      .p-table tbody tr:nth-child(5) { top: 255mm; right: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(5) td:nth-child(1) { width: 6mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(5) td:nth-child(2) { width: 19mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(5) td:nth-child(3) { width: 51mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(5) td:nth-child(4) { width: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(5) td:nth-child(5) { width: 21mm; height: 6.6mm; }

      /* السطر السادس */
      .p-table tbody tr:nth-child(6) { top: 261mm; right: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(6) td:nth-child(1) { width: 6mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(6) td:nth-child(2) { width: 19mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(6) td:nth-child(3) { width: 51mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(6) td:nth-child(4) { width: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(6) td:nth-child(5) { width: 21mm; height: 6.6mm; }

      /* السطر السابع */
      .p-table tbody tr:nth-child(7) { top: 268mm; right: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(7) td:nth-child(1) { width: 6mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(7) td:nth-child(2) { width: 19mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(7) td:nth-child(3) { width: 51mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(7) td:nth-child(4) { width: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(7) td:nth-child(5) { width: 21mm; height: 6.6mm; }

      /* السطر الثامن */
      .p-table tbody tr:nth-child(8) { top: 274.5mm; right: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(8) td:nth-child(1) { width: 6mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(8) td:nth-child(2) { width: 19mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(8) td:nth-child(3) { width: 51mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(8) td:nth-child(4) { width: 14mm; height: 6.6mm; }
      .p-table tbody tr:nth-child(8) td:nth-child(5) { width: 21mm; height: 6.6mm; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <div class="control-panel">
      
      <div class="top-actions">
        <button class="btn btn-print" onclick="prepareAndPrint()">
          🖨️ طباعة المواد (فوق الاستمارة)
        </button>
        <button class="btn btn-clear" onclick="clearSelections()">
          🧹 تفريغ الخيارات
        </button>
      </div>

      <div class="panel-header">
        <h1>منظومة إنشاء الاستمارات المطبوعة</h1>
        <p>اختر الكلية والمواد، اكتب الوحدات، واطبع الورقة مباشرة فوق الاستمارة الجاهزة.</p>
      </div>

      <div class="input-grid">
        <div class="field" style="grid-column: 1 / -1;">
          <label>تصفية المواد حسب الكلية</label>
          <select id="uiCollegeSelect" onchange="renderCheckboxes()">
            <option value="">جاري جلب بيانات الكليات...</option>
          </select>
        </div>
      </div>

      <label style="color:var(--gold); font-weight:bold; margin-bottom:10px; display:block;">
        حدد المواد المطلوب إدراجها (مع إمكانية كتابة عدد الوحدات):
      </label>
      <div class="courses-grid" id="checkboxesContainer">
      </div>

      <p id="statusMsg" style="text-align:center; margin-top:15px; color:#94a3b8; font-size:0.85rem;"></p>
    </div>
  </div>


  <div class="print-page">
    <table class="p-table">
      <thead>
        <tr>
          <th>ت</th>
          <th>رقم المقرر</th>
          <th>اسم المقرر</th>
          <th>الوحدات</th>
          <th>المجموعة</th>
          <th>تعليقات و ملاحظات</th>
        </tr>
      </thead>
      <tbody id="pTableBody">
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgmunZv-wU-kBJqP6cbVk-A1sqoWd9TYqesW7FS0CWz5XRejQ23hOJ0QqpTwpjI0X8kQ/exec";
    
    let allCourses = [];
    let collegesList = [];

    window.addEventListener("DOMContentLoaded", async () => {
      document.getElementById("statusMsg").innerText = "⏳ جاري الاتصال بالمنظومة لاستدعاء الكليات والمواد...";
      try {
        const res = await fetch(`${API_URL}?action=getCollegesAndCourses`);
        const data = await res.json();
        
        if (data.colleges && data.courses) {
          allCourses = data.courses;
          collegesList = data.colleges;
          
          const select = document.getElementById("uiCollegeSelect");
          select.innerHTML = '<option value="">-- اختر الكلية لعرض موادها --</option>';
          collegesList.forEach(col => {
            const opt = document.createElement("option");
            opt.value = col;
            opt.innerText = col;
            select.appendChild(opt);
          });
          
          document.getElementById("statusMsg").innerText = "✅ تم تحميل المواد بنجاح. اختر الكلية للبدء.";
          document.getElementById("statusMsg").style.color = "#22c55e";
        }
      } catch (e) {
        document.getElementById("statusMsg").innerText = "❌ فشل الاتصال بقاعدة البيانات.";
        document.getElementById("statusMsg").style.color = "#ef4444";
      }
    });

    function renderCheckboxes() {
      const selectedCollege = document.getElementById("uiCollegeSelect").value;
      const container = document.getElementById("checkboxesContainer");
      container.innerHTML = "";

      if (!selectedCollege) {
        container.innerHTML = "<span style='color:#94a3b8;'>الرجاء اختيار الكلية أولاً...</span>";
        return;
      }

      const filteredCourses = allCourses.filter(c => c.college === selectedCollege);
      
      if (filteredCourses.length === 0) {
        container.innerHTML = "<span style='color:#ef4444;'>لا توجد مواد مسجلة لهذه الكلية.</span>";
        return;
      }

      filteredCourses.forEach(c => {
        const label = document.createElement("label");
        label.className = "course-item";
        label.innerHTML = `
          <input type="checkbox" class="course-cb" data-code="${c.code}" data-name="${c.name}">
          <span class="c-code">[${c.code}]</span>
          <span>${c.name}</span>
          <input type="number" class="unit-input" id="units_${c.code}" placeholder="الوحدات" min="1" max="10" onclick="event.stopPropagation();">
        `;
        container.appendChild(label);
      });
    }

    function clearSelections() {
      const checkboxes = document.querySelectorAll(".course-cb");
      checkboxes.forEach(cb => cb.checked = false);
      
      const unitInputs = document.querySelectorAll(".unit-input");
      unitInputs.forEach(input => input.value = "");
    }

    function prepareAndPrint() {
      const checkboxes = document.querySelectorAll(".course-cb:checked");
      const tbody = document.getElementById("pTableBody");
      tbody.innerHTML = "";

      if (checkboxes.length === 0) {
        alert("الرجاء اختيار مادة واحدة على الأقل قبل الطباعة!");
        return;
      }

      checkboxes.forEach((cb, index) => {
        const code = cb.getAttribute("data-code");
        const name = cb.getAttribute("data-name");
        const units = document.getElementById(`units_${code}`).value; 

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${code}</td>
          <td>${name}</td>
          <td>${units}</td> 
          <td>60</td> 
          <td></td> 
        `;
        tbody.appendChild(tr);
      });

      window.print();
    }
  </script>
</body>
</html>
