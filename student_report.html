<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تقرير الطالب - جامعة السلام الدولية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* ألوان فخمة: كحلي عميق وذهبي ملكي */
      --primary: #0a1128; 
      --primary-light: #162447;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text-dark: #1f2937;
      --bg-main: #e2e8f0;
      --paper: #ffffff;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 15px;
      font-family: "Cairo", sans-serif;
      background: var(--bg-main);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      overflow-x: hidden;
    }

    /* شريط التحكم */
    .controls {
      width: 100%;
      max-width: 210mm;
      background: var(--paper);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .btn-print { 
      background: linear-gradient(135deg, var(--primary), var(--primary-light)); 
      color: var(--gold-light); 
      box-shadow: 0 4px 15px rgba(10, 17, 40, 0.2);
    }
    .btn-print:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(10, 17, 40, 0.3); }
    
    .btn-close { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .btn-close:hover { background: #e2e8f0; color: #1e293b; }

    /* الورقة */
    .page {
      width: 100%;
      max-width: 210mm;
      min-height: auto;
      background: var(--paper);
      padding: 15mm 12mm;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      border-radius: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* الترويسة الفخمة */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--primary);
      padding-bottom: 15px;
      margin-bottom: 25px;
      position: relative;
    }
    /* خط ذهبي رفيع تحت الخط الكحلي */
    .header::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gold);
    }

    .header-text { text-align: center; line-height: 1.4; }
    .header-text h1 { margin: 0; font-size: 1.15rem; font-weight: 900; color: var(--primary); }
    .header-text p { margin: 2px 0 0; font-size: 0.85rem; font-weight: 700; color: #64748b; }
    .logo img { width: 85px; height: 85px; object-fit: contain; }

    /* عنوان التقرير */
    .report-title {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 25px;
      color: var(--primary);
      position: relative;
      display: inline-block;
      align-self: center;
      padding: 0 15px;
    }
    .report-title::before, .report-title::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30px;
      height: 2px;
      background: var(--gold);
    }
    .report-title::before { right: -30px; }
    .report-title::after { left: -30px; }

    /* بيانات الطالب - تقسيم الشاشة */
    .student-info {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      background: #fafaf9;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 30px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-right: 5px solid var(--gold);
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }

    /* الكروت الداخلية للبيانات */
    .info-item {
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.01);
    }
    .info-item span.label { 
      font-size: 0.75rem; 
      font-weight: 800; 
      color: #64748b; 
      text-transform: uppercase;
    }
    .info-item span.val { 
      font-size: 1rem; 
      font-weight: 900; 
      color: var(--primary); 
      white-space: nowrap; 
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* تصميم الجدول الفخم وتمرير الهواتف */
    .table-container {
      width: 100%;
      border-radius: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--primary);
      box-shadow: 0 8px 20px rgba(10, 17, 40, 0.08);
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 650px;
    }

    table th, table td {
      padding: 12px 8px;
      text-align: center;
      font-size: 0.9rem;
      border-bottom: 1px solid #e2e8f0;
    }

    table th {
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      color: var(--gold-light);
      font-weight: 900;
      letter-spacing: 0.5px;
      white-space: nowrap;
      border-bottom: 3px solid var(--gold);
    }

    table tr { transition: background-color 0.2s; }
    table tr:hover { background-color: #f8fafc; }
    table td { color: #1e293b; font-weight: 700; }
    
    /* تثبيت الأعمدة في الجوال */
    .col-num, th:nth-child(1) {
      min-width: 45px;
      max-width: 45px;
      width: 45px;
      position: sticky;
      right: 0;
      z-index: 2;
    }
    th:nth-child(2), td:nth-child(2) {
      position: sticky;
      right: 45px;
      z-index: 2;
      border-left: 2px solid rgba(212, 175, 55, 0.4);
    }

    /* ألوان الأعمدة الثابتة */
    th:nth-child(1), th:nth-child(2) { 
      background: var(--primary); 
    }
    td:nth-child(1) { background: #f1f5f9; color: var(--primary); font-weight: 900; border-left: 1px solid #e2e8f0;}
    td:nth-child(2) { background: #ffffff; }
    tr:hover td:nth-child(2) { background: #f8fafc; }

    /* رسالة القفل */
    .lock-msg {
      text-align: center;
      padding: 18px;
      background: #fff1f2;
      border: 2px dashed #be123c;
      color: #9f1239;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(159, 18, 57, 0.05);
    }

    /* التذييل */
    .footer-note {
      margin-top: auto;
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      border-top: 2px dotted #cbd5e1;
      padding-top: 15px;
      font-weight: 700;
      line-height: 1.6;
    }
    .footer-note strong { color: var(--primary); font-weight: 900; }

    /* شاشات الجوال - تم إضافة screen لمنع تطبيقه في الطباعة */
    @media screen and (max-width: 768px) {
      body { padding: 10px; }
      .page { padding: 12px 10px; border-radius: 8px; }
      .header-text h1 { font-size: 1rem; }
      .header-text p { font-size: 0.75rem; }
      .logo img { width: 65px; height: 65px; }
      .student-info { grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
      .info-item:nth-child(1), .info-item:nth-child(4) { grid-column: span 2; }
      .report-title { font-size: 1.2rem; }
      .report-title::before, .report-title::after { width: 20px; }
    }

    /* إعدادات الطباعة الرسمية */
    @media print {
      @page { size: A4; margin: 0; }
      body { background: white; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .controls { display: none !important; }
      .page { box-shadow: none; padding: 15mm 12mm; width: 100%; max-width: none; min-height: 297mm; border-radius: 0; margin: 0; }
      .table-container { box-shadow: none; overflow: visible; border: 2px solid var(--primary); }
      table { min-width: 100% !important; width: 100% !important; }
      .col-num, th:nth-child(1), th:nth-child(2), td:nth-child(2) {
        position: static !important;
        border-left: 1px solid #e2e8f0 !important;
      }
      td:nth-child(1), td:nth-child(2) { background: transparent !important; }
      
      /* إجبار الطباعة على التقسيم الصحيح (الاسم مساحته مضاعفة) */
      .student-info { 
        box-shadow: none; 
        border-color: #cbd5e1;
        display: grid !important;
        grid-template-columns: 2fr 1fr 1fr !important;
      }
      .info-item:nth-child(1), .info-item:nth-child(4) { 
        grid-column: auto !important; 
      }
      .info-item span.val {
        white-space: nowrap !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls no-print">
    <button class="btn btn-print" onclick="window.print()">
      🖨️ طباعة الكشف الرسمي
    </button>
    <button class="btn btn-close" onclick="window.close()">
      ❌ إغلاق
    </button>
  </div>

  <div class="page" id="reportPage">
    <!-- المحتوى سيُضاف عبر الجافاسكريبت -->
  </div>

<script>
  function formatExcelTime(timeStr) {
    if (!timeStr) return "غير محدد";
    let s = String(timeStr).trim();
    if (s.includes("GMT") || s.includes("11:30:00") || s.includes("10:10:00") || s.includes("10:30:00")) {
      let match = s.match(/(\d{2}):(\d{2})/);
      if (match) return match[0];
    }
    return s;
  }

  window.addEventListener('DOMContentLoaded', () => {
    const rawData = sessionStorage.getItem('aiu_student_report');
    const container = document.getElementById('reportPage');

    if (!rawData) {
      container.innerHTML = `<h2 style="text-align:center; color:#be123c; margin-top:50px; font-weight:900;">⚠️ عذراً، لا توجد بيانات للطباعة. الرجاء الاستعلام أولاً من المنظومة.</h2>`;
      return;
    }

    const reportData = JSON.parse(rawData);
    const data = reportData.data; 
    const sid = reportData.id;
    const isLocked = reportData.isLocked;
    const selectedSemester = reportData.selectedSemester;
    const latestSemester = reportData.latestSemester;
    
    let coursesToPrint = data.courses || [];
    let semesterLabel = selectedSemester ? selectedSemester : "كشف عام (كل الفصول)";

    if (selectedSemester) {
      coursesToPrint = coursesToPrint.filter(c => (c.semester || c.sem || c.semester_name || "").trim() === selectedSemester);
    }
    
    if (!selectedSemester && isLocked) {
      coursesToPrint = coursesToPrint.filter(c => (c.semester || c.sem || c.semester_name || "").trim() !== latestSemester);
    }

    const today = new Date().toLocaleDateString("ar-LY");

    let coursesHtml = "";
    
    if (selectedSemester === latestSemester && isLocked) {
      coursesHtml = `<div class="lock-msg">🔒 مواد هذا الفصل محجوبة مؤقتاً لأسباب مالية.<br>يرجى مراجعة إدارة الشؤون المالية لتسوية الأوضاع.</div>`;
    } else if (coursesToPrint.length === 0) {
      coursesHtml = `<div class="lock-msg" style="background:#f8fafc; border-color:#cbd5e1; color:#475569;">لا توجد مواد مسجلة قابلة للعرض في هذا السجل.</div>`;
    } else {
      let trs = coursesToPrint.map((c, index) => {
        let day = (c.day || c.day_name || c.dayName || "").trim();
        let start = formatExcelTime(c.startTime || c.start_time || c.start || "");
        let end = formatExcelTime(c.endTime || c.end_time || c.end || "");
        
        let timeStr = "غير محدد";
        if (day || start !== "غير محدد") {
          timeStr = `${day} (${start} - ${end})`.replace("غير محدد", "").trim();
        }
        
        let roomStr = c.room || c.room_name || c.roomName || c.hall || c.lecture_hall || "-";
        let instStr = c.instructor || c.instructor_name || c.instructorName || c.teacher || c.professor || "-";

        return `
          <tr>
            <td class="col-num">${index + 1}</td>
            <td style="font-weight:800;">${c.code || '-'}</td>
            <td style="font-weight:900; color:var(--primary);">${c.name || '-'}</td>
            <td>${timeStr}</td>
            <td>${roomStr}</td>
            <td>${instStr}</td>
          </tr>
        `;
      }).join("");

      coursesHtml = `
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 45px;">م</th>
                <th>رمز المادة</th>
                <th>اسم المقرر الدراسي</th>
                <th>الموعد</th>
                <th>القاعة</th>
                <th>أستاذ المادة</th>
              </tr>
            </thead>
            <tbody>
              ${trs}
            </tbody>
          </table>
        </div>
      `;
    }

    if (!selectedSemester && isLocked) {
      coursesHtml += `<div class="lock-msg" style="padding:12px; margin-top:-10px; font-size:0.9rem;">⚠ ملاحظة: تم إخفاء مواد الفصل الحالي (${latestSemester}) فقط بسبب عدم استكمال الإجراءات المالية.</div>`;
    }

    container.innerHTML = `
      <div class="header">
        <div class="header-text" style="text-align: right;">
          <h1>أ. أيوب الحوات</h1>
          <p>رئيس وحدة المنظومة</p>
        </div>
        <div class="logo">
          <!-- تأكد أن مسار الشعار صحيح لديك -->
          <img src="aiu-logo.png" alt="شعار الجامعة">
        </div>
        <div class="header-text" style="text-align: left;">
          <h1>جامعة السلام الدولية</h1>
          <p>إدارة التسجيل والدراسة والامتحانات</p>
        </div>
      </div>

      <div class="report-title">كشف المقررات الدراسية للطالب</div>

      <div class="student-info">
        <div class="info-item">
          <span class="label">اسم الطالب</span>
          <span class="val">${data.full_name || "-"}</span>
        </div>
        <div class="info-item">
          <span class="label">رقم القيد</span>
          <span class="val">${sid}</span>
        </div>
        <div class="info-item">
          <span class="label">الكلية</span>
          <span class="val">${data.college || "-"}</span>
        </div>
        <div class="info-item">
          <span class="label">القسم العلمي</span>
          <span class="val">${data.department || "-"}</span>
        </div>
        <div class="info-item">
          <span class="label">الفصل المطبوع</span>
          <span class="val">${semesterLabel}</span>
        </div>
        <div class="info-item">
          <span class="label">تاريخ الإصدار</span>
          <span class="val">${today}</span>
        </div>
      </div>

      ${coursesHtml}

      <div class="footer-note">
        هذا الكشف مخصص <strong>للاطلاع فقط</strong> ولا يعتبر مستنداً رسمياً للمطالبة بأي إجراء.<br>
        تم استخراج هذا التقرير آلياً من البوابة الإلكترونية لجامعة السلام الدولية - برمجة: أ. أيوب الحوات
      </div>
    `;
  });
</script>
</body>
</html>
